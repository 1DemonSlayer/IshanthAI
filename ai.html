<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ishanth AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ff9a00%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23f43f5e%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23a855f7%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2220%22%20fill%3D%22url%28%23lg%29%22/%3E%3Crect%20x%3D%2226%22%20y%3D%2229%22%20width%3D%2212%22%20height%3D%2225%22%20rx%3D%226%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2217%22%20r%3D%228%22%20fill%3D%22%23fff%22/%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M38%2021L46%2027L36%2025Z%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff;--card:#f0f4f9;--field:#ffffff;--ink:#1f1f1f;--muted:#5f6368;--line:#dfe3e8;
  --hover:#e2e8f0;--accent:#0b57d0;--user-bubble:#e8f0fe;--err:#b3261e;--errbg:#fce8e6;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131314;--card:#1e1f20;--field:#1e1f20;--ink:#e3e3e3;--muted:#9aa0a6;--line:#3c4043;
    --hover:#333537;--accent:#a8c7fa;--user-bubble:#282a2c;--err:#f2b8b5;--errbg:#3b1f1d;color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

/* Header */
header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 18px;border-bottom:1px solid var(--line);
  padding-top:max(12px,env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:32px;height:32px}
.brand h1{
  font-size:1.25rem;font-weight:500;
  background:linear-gradient(90deg,#ff9a00,#f43f5e 50%,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.controls{display:flex;align-items:center;gap:8px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:20px;font-size:.84rem;font-weight:500;
  background:var(--card);border:1px solid var(--line);transition:.15s;
}
.pill:hover{background:var(--hover)}
.pill.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* Chat Area */
#chat{
  flex:1;overflow-y:auto;padding:20px 16px;
  display:flex;flex-direction:column;gap:18px;
  max-width:820px;width:100%;margin:0 auto;
}
.welcome{
  margin:auto;text-align:center;max-width:440px;padding:20px;
}
.welcome h2{
  font-size:1.7rem;font-weight:500;margin-bottom:8px;
  background:linear-gradient(90deg,#ff9a00,#f43f5e 50%,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.welcome p{color:var(--muted);font-size:.95rem;line-height:1.5}

.msg{display:flex;flex-direction:column;gap:8px;max-width:88%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start;width:100%}

.bubble{
  padding:13px 17px;border-radius:20px;line-height:1.6;font-size:.96rem;
  white-space:pre-wrap;word-break:break-word;
}
.msg.user .bubble{background:var(--user-bubble);border-bottom-right-radius:6px}
.msg.ai .bubble{background:var(--card);border-bottom-left-radius:6px;width:100%}
.msg.err .bubble{background:var(--errbg);color:var(--err)}

.msg img{
  max-width:260px;max-height:260px;border-radius:16px;
  border:1px solid var(--line);object-fit:cover;
}

.msg-actions{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font-size:.8rem;padding:6px 12px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);color:var(--ink);
  display:inline-flex;align-items:center;gap:5px;
}
.chip:hover{background:var(--hover)}
.chip:disabled{opacity:.5;cursor:not-allowed}

/* Composer */
.composer-wrap{
  padding:10px 16px max(14px,env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--line);
}
.composer{
  max-width:820px;margin:0 auto;background:var(--card);
  border:1px solid var(--line);border-radius:24px;padding:10px 14px;
  display:flex;flex-direction:column;gap:8px;
}
#previewBar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:6px;border-bottom:1px solid var(--line);
}
.thumb-box{position:relative;display:inline-block}
.thumb-box img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.remove-img{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--ink);color:var(--bg);font-size:.75rem;display:grid;place-items:center;
}
.quick-prompts{display:flex;gap:6px;flex-wrap:wrap}
.qbtn{
  background:var(--bg);border:1px solid var(--line);border-radius:14px;
  padding:6px 11px;font-size:.82rem;color:var(--accent);font-weight:500;
}
.qbtn:hover{background:var(--hover)}

.input-row{display:flex;align-items:flex-end;gap:8px}
textarea{
  flex:1;background:transparent;border:0;outline:none;resize:none;
  max-height:130px;padding:6px 4px;font-size:1rem;line-height:1.4;
}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);flex-shrink:0;
}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.send-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:var(--bg);flex-shrink:0;
}
.send-btn:disabled{opacity:.5;cursor:not-allowed}

/* Camera Modal */
#camModal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;
}
#camVideo{width:min(100%,480px);border-radius:20px;background:#000}
.cam-btns{display:flex;gap:12px}
.cam-btns button{padding:11px 22px;border-radius:24px;font-weight:500}
#snapBtn{background:#fff;color:#000}
#closeCamBtn{background:rgba(255,255,255,.2);color:#fff}

.typing{color:var(--muted);font-style:italic;font-size:.9rem}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a00"/><stop offset=".55" stop-color="#f43f5e"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="64" height="64" rx="20" fill="url(#g)"/><rect x="26" y="29" width="12" height="25" rx="6" fill="#fff"/><circle cx="32" cy="17" r="8" fill="#fff"/><path fill="#fff" d="M38 21L46 27L36 25Z"/></svg>
    <h1>Ishanth AI</h1>
  </div>
  <div class="controls">
    <button type="button" id="friendlyToggle" class="pill active" title="Toggle Friendly Chat Mode">😊 Friendly Mode: ON</button>
    <button type="button" id="logoutBtn" class="pill">Log out</button>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h2>Hello! How can I help?</h2>
    <p>Upload an image or snap a photo to get answers, step-by-step solutions, or extract text—or just chat with me!</p>
  </div>
</main>

<div class="composer-wrap">
  <div class="composer">
    <div id="previewBar" hidden>
      <div class="thumb-box">
        <img id="thumbImg" alt="Selected preview">
        <button type="button" class="remove-img" id="removeImg" title="Remove image">✕</button>
      </div>
      <div class="quick-prompts">
        <button type="button" class="qbtn" data-prompt="Give me the direct answer for what is shown in this image.">✅ Give me answer</button>
        <button type="button" class="qbtn" data-prompt="Solve the problem in this image with a clear step-by-step solution.">📝 Give me solution</button>
        <button type="button" class="qbtn" data-prompt="Extract and transcribe all readable text from this image accurately.">📄 Extract text</button>
      </div>
    </div>

    <div class="input-row">
      <!-- Upload from gallery/files -->
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button type="button" class="icon-btn" id="uploadBtn" title="Upload image">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>

      <!-- Click photo from camera -->
      <button type="button" class="icon-btn" id="cameraBtn" title="Take photo with camera">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>

      <textarea id="promptInput" rows="1" placeholder="Ask anything or upload an image…"></textarea>

      <button type="button" class="send-btn" id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Live Camera Modal -->
<div id="camModal" hidden>
  <video id="camVideo" autoplay playsinline></video>
  <canvas id="camCanvas" hidden></canvas>
  <div class="cam-btns">
    <button type="button" id="snapBtn">📸 Capture Photo</button>
    <button type="button" id="closeCamBtn">Cancel</button>
  </div>
</div>

<script type="module">
import { auth } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 🔑 REPLACE WITH YOUR GEMINI API KEY
const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";
const MODEL = "gemini-2.5-flash";

const $ = id => document.getElementById(id);
let friendlyMode = true;
let selectedImage = null; // { base64, mimeType, dataUrl }
let camStream = null;
let busy = false;
let chatHistory = [];

/* ---------- Auth Check ---------- */
onAuthStateChanged(auth, user => {
  if (!user) location.replace("index.html");
});
$("logoutBtn").onclick = async () => {
  await signOut(auth);
  location.replace("index.html");
};

/* ---------- Friendly Mode Toggle ---------- */
$("friendlyToggle").onclick = () => {
  friendlyMode = !friendlyMode;
  $("friendlyToggle").classList.toggle("active", friendlyMode);
  $("friendlyToggle").textContent = friendlyMode ? "😊 Friendly Mode: ON" : "😐 Friendly Mode: OFF";
};

/* ---------- Image Upload ---------- */
$("uploadBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    setImage(reader.result, file.type || "image/jpeg");
  };
  reader.readAsDataURL(file);
  e.target.value = "";
};

function setImage(dataUrl, mimeType) {
  const base64 = dataUrl.split(",")[1];
  selectedImage = { base64, mimeType, dataUrl };
  $("thumbImg").src = dataUrl;
  $("previewBar").hidden = false;
}

$("removeImg").onclick = clearImage;
function clearImage() {
  selectedImage = null;
  $("previewBar").hidden = true;
  $("thumbImg").src = "";
}

/* ---------- Camera Capture ---------- */
$("cameraBtn").onclick = async () => {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }, audio: false
    });
    $("camVideo").srcObject = camStream;
    $("camModal").hidden = false;
  } catch (err) {
    alert("Could not access camera. Please allow camera permission or use the upload button.");
  }
};

function stopCamera() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
  $("camModal").hidden = true;
}

$("closeCamBtn").onclick = stopCamera;
$("snapBtn").onclick = () => {
  const video = $("camVideo");
  const canvas = $("camCanvas");
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
  setImage(dataUrl, "image/jpeg");
  stopCamera();
};

/* ---------- Quick Action Chips (Answer / Solution / Extract Text) ---------- */
document.querySelectorAll(".qbtn").forEach(btn => {
  btn.onclick = () => {
    $("promptInput").value = btn.dataset.prompt;
    sendMessage();
  };
});

/* ---------- Textarea Auto-Resize & Enter to Send ---------- */
$("promptInput").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = this.scrollHeight + "px";
});
$("promptInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
$("sendBtn").onclick = () => sendMessage();

/* ---------- Render Messages ---------- */
function appendMessage(role, text, imgUrl = null, isError = false) {
  $("welcome")?.remove();
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}${isError ? " err" : ""}`;

  if (imgUrl) {
    const img = document.createElement("img");
    img.src = imgUrl;
    wrap.appendChild(img);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  wrap.appendChild(bubble);

  // Add "Improve Answer" button to AI responses
  if (role === "ai" && !isError) {
    const actions = document.createElement("div");
    actions.className = "msg-actions";

    const improveBtn = document.createElement("button");
    improveBtn.type = "button";
    improveBtn.className = "chip";
    improveBtn.textContent = "✨ Improve answer";
    improveBtn.onclick = () => improveAnswer(text, improveBtn);

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "chip";
    copyBtn.textContent = "📋 Copy";
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(text);
      copyBtn.textContent = "✓ Copied";
      setTimeout(() => (copyBtn.textContent = "📋 Copy"), 1500);
    };

    actions.append(improveBtn, copyBtn);
    wrap.appendChild(actions);
  }

  $("chat").appendChild(wrap);
  $("chat").scrollTop = $("chat").scrollHeight;
  return bubble;
}

/* ---------- Core Gemini API Call ---------- */
async function callGemini(userParts) {
  const systemInstruction = friendlyMode
    ? "You are Ishanth AI, a warm, encouraging, and friendly assistant. When an image is provided, inspect it carefully: give the direct answer, show a clear step-by-step solution when solving problems, or accurately extract text if asked. Never say you cannot view images—always analyze the attached image directly."
    : "You are Ishanth AI, a helpful and precise assistant. When an image is provided, inspect it carefully: provide the direct answer, step-by-step solution, or extracted text clearly and concisely. Never say you cannot view images.";

  const contents = [
    ...chatHistory,
    { role: "user", parts: userParts }
  ];

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: systemInstruction }] },
        contents
      })
    }
  );

  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Failed to get response from AI.");
  const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";

  // Save text turn to history (keeping payload lightweight)
  const textOnlyParts = userParts.filter(p => p.text);
  if (textOnlyParts.length) {
    chatHistory.push({ role: "user", parts: textOnlyParts });
    chatHistory.push({ role: "model", parts: [{ text: reply }] });
  }
  return reply;
}

/* ---------- Send User Prompt + Optional Image ---------- */
async function sendMessage(customPrompt = null) {
  if (busy) return;
  const rawText = (customPrompt ?? $("promptInput").value).trim();
  if (!rawText && !selectedImage) return;

  const promptText = rawText || "Analyze this image and give me the answer and solution.";
  const imgToSend = selectedImage;

  // Reset inputs
  $("promptInput").value = "";
  $("promptInput").style.height = "auto";
  clearImage();

  appendMessage("user", promptText, imgToSend?.dataUrl || null);

  busy = true;
  $("sendBtn").disabled = true;
  const typingBubble = appendMessage("ai", "Thinking…");
  typingBubble.classList.add("typing");

  try {
    const parts = [{ text: promptText }];
    if (imgToSend) {
      parts.push({
        inlineData: {
          mimeType: imgToSend.mimeType,
          data: imgToSend.base64
        }
      });
    }

    const reply = await callGemini(parts);
    typingBubble.parentElement.remove();
    appendMessage("ai", reply);
  } catch (err) {
    typingBubble.parentElement.remove();
    appendMessage("ai", "Error: " + err.message, null, true);
  } finally {
    busy = false;
    $("sendBtn").disabled = false;
  }
}

/* ---------- Improve Previous Answer ---------- */
async function improveAnswer(previousReply, btn) {
  if (busy) return;
  btn.disabled = true;
  busy = true;
  $("sendBtn").disabled = true;

  const typingBubble = appendMessage("ai", "Improving the answer…");
  typingBubble.classList.add("typing");

  try {
    const improvePrompt = `Please improve, clarify, and enrich your previous answer so it is easier to understand, well-structured, and more helpful:\n\n"${previousReply}"`;
    const improved = await callGemini([{ text: improvePrompt }]);
    typingBubble.parentElement.remove();
    appendMessage("ai", improved);
  } catch (err) {
    typingBubble.parentElement.remove();
    appendMessage("ai", "Error improving answer: " + err.message, null, true);
  } finally {
    busy = false;
    $("sendBtn").disabled = false;
  }
}
</script>
</body>
</html>
