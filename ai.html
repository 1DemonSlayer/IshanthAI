<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ishanth AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ff9a00%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23f43f5e%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23a855f7%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2220%22%20fill%3D%22url%28%23lg%29%22/%3E%3Crect%20x%3D%2226%22%20y%3D%2229%22%20width%3D%2212%22%20height%3D%2225%22%20rx%3D%226%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2217%22%20r%3D%228%22%20fill%3D%22%23fff%22/%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M38%2021L46%2027L36%2025Z%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff;--card:#f0f4f9;--field:#ffffff;--ink:#1f1f1f;--muted:#5f6368;--line:#dfe3e8;
  --hover:#e2e8f0;--accent:#0b57d0;--err:#b3261e;--errbg:#fce8e6;--ok:#146c2e;--okbg:#e6f4ea;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131314;--card:#1e1f20;--field:#131314;--ink:#e3e3e3;--muted:#9aa0a6;--line:#3c4043;
    --hover:#333537;--accent:#a8c7fa;--err:#f2b8b5;--errbg:#3b1f1d;--ok:#9fd8ac;--okbg:#17301d;color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top Bar using your exact palette */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;display:block}
h1{
  font-size:1.3rem;font-weight:500;letter-spacing:-.02em;
  background:linear-gradient(90deg,#ff9a00,#f43f5e 50%,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content;
}
.bar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill-btn{
  padding:7px 14px;border-radius:20px;font-size:.84rem;
  background:var(--field);border:1px solid var(--line);color:var(--ink);
}
.pill-btn:hover{background:var(--hover)}
.pill-btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}

/* Chat Stream */
#chat{
  flex:1;overflow-y:auto;padding:20px 16px;
  display:flex;flex-direction:column;gap:16px;
  width:min(100%,820px);margin:0 auto;
}
.hero-card{
  margin:auto;width:min(100%,460px);background:var(--card);
  border-radius:28px;padding:28px 24px;text-align:center;
}
.hero-card h2{
  font-size:1.55rem;font-weight:500;letter-spacing:-.02em;margin-bottom:8px;
  background:linear-gradient(90deg,#ff9a00,#f43f5e 50%,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-card p{color:var(--muted);font-size:.92rem;line-height:1.5}

.msg{display:flex;flex-direction:column;gap:8px;max-width:88%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start;width:100%}
.bubble{
  padding:13px 16px;border-radius:20px;line-height:1.55;font-size:.95rem;
  white-space:pre-wrap;word-break:break-word;
}
.msg.user .bubble{background:var(--hover);border-bottom-right-radius:6px}
.msg.ai .bubble{background:var(--card);border-bottom-left-radius:6px;width:100%}
.msg.err .bubble{background:var(--errbg);color:var(--err)}
.msg img{max-width:250px;max-height:250px;border-radius:16px;border:1px solid var(--line)}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font-size:.8rem;padding:6px 12px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);color:var(--accent);
}
.chip:hover{background:var(--hover)}
.chip:disabled{opacity:.5;cursor:not-allowed}

/* Composer Card matching your theme */
.foot{padding:10px 16px 14px;background:var(--bg)}
.composer{
  width:min(100%,820px);margin:0 auto;background:var(--card);
  border-radius:24px;padding:10px 14px;border:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;
}
#previewBox{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:8px;border-bottom:1px solid var(--line);
}
.thumb-wrap{position:relative;display:inline-block}
.thumb-wrap img{width:60px;height:60px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.x-btn{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--err);color:#fff;font-size:.75rem;display:grid;place-items:center;
}
.img-actions{display:flex;gap:6px;flex-wrap:wrap}
.q-btn{
  padding:6px 11px;border-radius:14px;font-size:.82rem;
  background:var(--field);border:1px solid var(--line);color:var(--accent);font-weight:500;
}
.q-btn:hover{background:var(--hover)}

.row{display:flex;align-items:flex-end;gap:8px}
textarea{
  flex:1;background:var(--field);border:1px solid var(--line);border-radius:16px;
  padding:10px 14px;font-size:.96rem;line-height:1.4;resize:none;max-height:130px;outline:none;
}
textarea:focus{border-color:var(--accent)}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--field);border:1px solid var(--line);color:var(--muted);flex-shrink:0;
}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.send-btn{
  padding:0 18px;height:40px;border-radius:20px;background:var(--accent);
  color:var(--bg);font-weight:500;font-size:.92rem;flex-shrink:0;
}
.send-btn:disabled{opacity:.6;cursor:not-allowed}

/* Camera Modal */
#camModal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;
}
#camVideo{width:min(100%,460px);border-radius:20px;background:#000}
.cam-row{display:flex;gap:10px}
.cam-row button{padding:10px 20px;border-radius:20px;font-weight:500}
#snapBtn{background:var(--accent);color:var(--bg)}
#cancelCam{background:var(--card);color:var(--ink)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a00"/><stop offset=".55" stop-color="#f43f5e"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="64" height="64" rx="20" fill="url(#g)"/><rect x="26" y="29" width="12" height="25" rx="6" fill="#fff"/><circle cx="32" cy="17" r="8" fill="#fff"/><path fill="#fff" d="M38 21L46 27L36 25Z"/></svg>
    <h1>Ishanth AI</h1>
  </div>
  <div class="bar-actions">
    <button type="button" id="friendlyBtn" class="pill-btn on">Friendly mode: ON</button>
    <button type="button" id="keyBtn" class="pill-btn">Groq API key</button>
    <button type="button" id="logoutBtn" class="pill-btn">Log out</button>
  </div>
</header>

<main id="chat">
  <div class="hero-card" id="hero">
    <h2>Ask with text or image</h2>
    <p>Upload a photo or click one with your camera to get answers, step-by-step solutions, or extract text.</p>
  </div>
</main>

<footer class="foot">
  <div class="composer">
    <div id="previewBox" hidden>
      <div class="thumb-wrap">
        <img id="previewImg" alt="Attached image">
        <button type="button" class="x-btn" id="removeImg" aria-label="Remove image">✕</button>
      </div>
      <div class="img-actions">
        <button type="button" class="q-btn" data-mode="answer">Give answer</button>
        <button type="button" class="q-btn" data-mode="solution">Give solution</button>
        <button type="button" class="q-btn" data-mode="extract">Extract text</button>
      </div>
    </div>

    <div class="row">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button type="button" class="icon-btn" id="uploadBtn" title="Upload image" aria-label="Upload image">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <button type="button" class="icon-btn" id="camBtn" title="Click photo" aria-label="Click photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <textarea id="prompt" rows="1" placeholder="Type a message or attach an image…"></textarea>
      <button type="button" class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>
</footer>

<div id="camModal" hidden>
  <video id="camVideo" autoplay playsinline></video>
  <canvas id="camCanvas" hidden></canvas>
  <div class="cam-row">
    <button type="button" id="snapBtn">Click photo</button>
    <button type="button" id="cancelCam">Cancel</button>
  </div>
</div>

<script type="module">
import { auth } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Put your Groq API key here (starts with gsk_...)
const DEFAULT_GROQ_KEY = "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";
const VISION_MODEL = "meta-llama/llama-4-scout-17b-16e-instruct"; // supports text + image
const TEXT_MODEL   = "llama-3.3-70b-versatile";
const GROQ_URL     = "https://api.groq.com/openai/v1/chat/completions"; //

const $ = id => document.getElementById(id);
let friendly = true;
let imageData = null; // { dataUrl, mimeType }
let stream = null;
let busy = false;
let history = [];

function getApiKey() {
  const saved = localStorage.getItem("ishanth_groq_key");
  if (saved && saved.trim()) return saved.trim();
  if (DEFAULT_GROQ_KEY && DEFAULT_GROQ_KEY !== "YOUR_GROQ_API_KEY") return DEFAULT_GROQ_KEY.trim();
  return "";
}

$("keyBtn").onclick = () => {
  const current = getApiKey();
  const entered = prompt("Enter your Groq API key (gsk_...):", current);
  if (entered !== null) {
    localStorage.setItem("ishanth_groq_key", entered.trim());
  }
};

onAuthStateChanged(auth, user => {
  if (!user) location.replace("index.html");
});
$("logoutBtn").onclick = async () => {
  await signOut(auth);
  location.replace("index.html");
};

$("friendlyBtn").onclick = () => {
  friendly = !friendly;
  $("friendlyBtn").classList.toggle("on", friendly);
  $("friendlyBtn").textContent = friendly ? "Friendly mode: ON" : "Friendly mode: OFF";
};

/* ---------- Image Upload & Camera ---------- */
$("uploadBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    imageData = { dataUrl: reader.result, mimeType: file.type || "image/jpeg" };
    $("previewImg").src = imageData.dataUrl;
    $("previewBox").hidden = false;
  };
  reader.readAsDataURL(file);
  e.target.value = "";
};

$("removeImg").onclick = clearImage;
function clearImage() {
  imageData = null;
  $("previewImg").src = "";
  $("previewBox").hidden = true;
}

$("camBtn").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    $("camVideo").srcObject = stream;
    $("camModal").hidden = false;
  } catch {
    alert("Camera permission denied or unavailable. Use upload instead.");
  }
};
function closeCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $("camModal").hidden = true;
}
$("cancelCam").onclick = closeCam;
$("snapBtn").onclick = () => {
  const v = $("camVideo"), c = $("camCanvas");
  c.width = v.videoWidth || 640;
  c.height = v.videoHeight || 480;
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL("image/jpeg", 0.9);
  imageData = { dataUrl, mimeType: "image/jpeg" };
  $("previewImg").src = dataUrl;
  $("previewBox").hidden = false;
  closeCam();
};

/* ---------- Quick Image Actions ---------- */
const MODE_PROMPTS = {
  answer:   "Look at this image and give me the direct answer clearly.",
  solution: "Look at this image and give me a clear, step-by-step solution.",
  extract:  "Extract and transcribe ALL text from this image accurately, preserving line breaks and formatting. Do not summarize or skip text."
};

document.querySelectorAll(".q-btn").forEach(btn => {
  btn.onclick = () => {
    if (!imageData) return;
    const custom = $("prompt").value.trim();
    const basePrompt = MODE_PROMPTS[btn.dataset.mode];
    const finalPrompt = custom ? `${basePrompt}\nAdditional note: ${custom}` : basePrompt;
    runTurn(finalPrompt, imageData, btn.dataset.mode === "extract");
  };
});

/* ---------- Chat UI & Groq Call ---------- */
$("prompt").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = this.scrollHeight + "px";
});
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
$("sendBtn").onclick = handleSend;

function handleSend() {
  const text = $("prompt").value.trim();
  if (!text && !imageData) return;
  const isExtract = /\b(extract|ocr|transcribe|read)\b.*\btext\b/i.test(text);
  const promptToUse = text || "Give me the answer and solution for what is shown in this image.";
  runTurn(promptToUse, imageData, isExtract);
}

function addMsg(role, text, imgSrc = null, isErr = false) {
  $("hero")?.remove();
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}${isErr ? " err" : ""}`;
  if (imgSrc) {
    const img = document.createElement("img");
    img.src = imgSrc;
    wrap.appendChild(img);
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  wrap.appendChild(bubble);

  if (role === "ai" && !isErr) {
    const acts = document.createElement("div");
    acts.className = "actions";

    const imp = document.createElement("button");
    imp.type = "button";
    imp.className = "chip";
    imp.textContent = "Improve answer";
    imp.onclick = () => improveReply(text, imp);

    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "chip";
    copy.textContent = "Copy";
    copy.onclick = () => {
      navigator.clipboard.writeText(text);
      copy.textContent = "Copied";
      setTimeout(() => (copy.textContent = "Copy"), 1200);
    };

    acts.append(imp, copy);
    wrap.appendChild(acts);
  }

  $("chat").appendChild(wrap);
  $("chat").scrollTop = $("chat").scrollHeight;
  return bubble;
}

async function callGroq(messages, model) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("Groq API key is missing. Click 'Groq API key' at the top or set DEFAULT_GROQ_KEY.");

  const res = await fetch(GROQ_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${apiKey}`
    },
    body: JSON.stringify({ model, messages, temperature: 0.3 })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Groq API request failed.");
  return data.choices?.[0]?.message?.content?.trim() || "No response returned.";
}

async function runTurn(userPrompt, attachedImg, isExtractMode = false) {
  if (busy) return;
  $("prompt").value = "";
  $("prompt").style.height = "auto";
  clearImage();

  addMsg("user", userPrompt, attachedImg?.dataUrl || null);

  busy = true;
  $("sendBtn").disabled = true;
  const waitBubble = addMsg("ai", isExtractMode ? "Extracting text…" : "Thinking…");

  try {
    const sysText = isExtractMode
      ? "You are an accurate OCR engine. Output ONLY the extracted text from the image faithfully without adding commentary."
      : friendly
        ? "You are Ishanth AI, a friendly, warm, and helpful assistant. Give clear answers, step-by-step solutions when asked, and accurately read images when provided."
        : "You are Ishanth AI, a clear and direct assistant. Give concise answers, step-by-step solutions when asked, and accurately read images when provided.";

    const userContent = attachedImg
      ? [
          { type: "text", text: userPrompt },
          { type: "image_url", image_url: { url: attachedImg.dataUrl } }
        ]
      : userPrompt;

    const reqMessages = [
      { role: "system", content: sysText },
      ...(attachedImg ? [] : history.slice(-8)),
      { role: "user", content: userContent }
    ];

    const reply = await callGroq(reqMessages, attachedImg ? VISION_MODEL : TEXT_MODEL);
    waitBubble.parentElement.remove();
    addMsg("ai", reply);

    if (!attachedImg) {
      history.push({ role: "user", content: userPrompt }, { role: "assistant", content: reply });
    }
  } catch (err) {
    waitBubble.parentElement.remove();
    addMsg("ai", err.message, null, true);
  } finally {
    busy = false;
    $("sendBtn").disabled = false;
  }
}

async function improveReply(prevAnswer, btn) {
  if (busy) return;
  busy = true;
  btn.disabled = true;
  $("sendBtn").disabled = true;
  const waitBubble = addMsg("ai", "Improving answer…");

  try {
    const sysText = friendly
      ? "You are Ishanth AI, a friendly assistant. Rewrite and improve the given answer so it is clearer, better structured, and easier to follow."
      : "You are Ishanth AI. Rewrite and improve the given answer for maximum clarity, accuracy, and structure.";

    const improved = await callGroq([
      { role: "system", content: sysText },
      { role: "user", content: `Improve this answer:\n\n${prevAnswer}` }
    ], TEXT_MODEL);

    waitBubble.parentElement.remove();
    addMsg("ai", improved);
  } catch (err) {
    waitBubble.parentElement.remove();
    addMsg("ai", err.message, null, true);
  } finally {
    busy = false;
    btn.disabled = false;
    $("sendBtn").disabled = false;
  }
}
</script>
</body>
</html>
